name: Sync Official Gundam Card Game Data

on:
  schedule:
    # Run every Monday and Thursday at 04:00 UTC
    - cron: '0 4 * * 1,4'
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Re-fetch every card detail even if already cached'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync-gundam-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: a. Update official play rules and FAQs
        run: python3 scripts/sync_rules.py

      - name: b & c. Update collections and cards per collection (+ local SQLite DB)
        run: |
          if [ "${{ github.event.inputs.force_full_refresh }}" = "true" ]; then
            python3 scripts/sync_catalog.py
          else
            python3 scripts/sync_catalog.py --incremental
          fi

      - name: Verify data integrity
        run: |
          python3 -c "
          import json, sqlite3
          from pathlib import Path
          pkgs = json.loads(Path('data/packages.json').read_text())['packages']
          conn = sqlite3.connect('data/gundam.db')
          card_cnt = conn.execute('SELECT COUNT(*) FROM cards').fetchone()[0]
          pkg_cnt = conn.execute('SELECT COUNT(*) FROM packages').fetchone()[0]
          rule_cnt = conn.execute('SELECT COUNT(*) FROM play_rules').fetchone()[0]
          assert pkg_cnt == len(pkgs) and pkg_cnt > 0
          assert card_cnt > 0
          assert rule_cnt > 0
          print(f'Verified SQLite DB: {pkg_cnt} collections, {card_cnt} cards, {rule_cnt} ruleset(s).')
          "

      - name: Commit and push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): sync official GCG rules, collections, and cards'
          file_pattern: 'data/packages.json data/rules.json data/collections/*.json data/gundam.db'
